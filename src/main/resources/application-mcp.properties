# Common configuration for the MCP server (profile `mcp`), shared by all transports.
# Activated by the `mcp` subcommand (stdio), by `lsp --mcp` and by `websocket --mcp` (Streamable HTTP).
# Transport is selected by the sub-profile: mcp-stdio / lsp-mcp / websocket-mcp.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.type=SYNC
# Имя и версия сервера берутся из AutoServerInfo (см. McpServerInfoCustomizer),
# чтобы не дублировать источник истины (spring.application.name + версия из манифеста).
spring.ai.mcp.server.annotation-scanner.enabled=true
# Инструкции сервера: клиент получает их в ответе на initialize, до первого вызова инструмента.
spring.ai.mcp.server.instructions=\
  BSL Language Server: static analysis and code navigation for 1C:Enterprise (BSL) and OneScript code. \
  Tools that take a file answer only for files inside a registered workspace folder: the project root \
  an editor would open, holding the sources and, when present, `.bsl-language-server.json`. \
  Before the first such call, check the `list_workspace_folders` tool; if the project is not there, \
  register its root with the `register_workspace_folder` tool, which indexes the sources and returns the \
  folder `uri` that tools taking `workspaceFolder` expect. \
  Lines and characters of positions are zero-based.
