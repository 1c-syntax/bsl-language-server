name: GitHub Pages

on:
  push:
    branches:
    - master
    - develop
    paths:
    - 'docs/**'
    - 'src/main/resources/com/github/_1c_syntax/bsl/languageserver/configuration/**'
    - 'src/main/java/**'
    - 'package.json'
    - 'package-lock.json'
    - '.github/workflows/gh-pages.yml'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Ветка develop публикуется в подкаталог /dev, master — в корень сайта.
      DOCS_BASE: ${{ github.ref == 'refs/heads/develop' && '/bsl-language-server/dev/' || '/bsl-language-server/' }}
      DOCS_TITLE: ${{ github.ref == 'refs/heads/develop' && 'BSL Language Server Dev' || 'BSL Language Server' }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: 'corretto'
        cache: gradle

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Build javadoc
      run: ./gradlew --no-daemon javadoc

    - name: Dowload latest GitHub Pages
      run: |
        wget https://github.com/${{ github.repository }}/archive/gh-pages.zip || true
        unzip gh-pages.zip || true
        mkdir tmp-bench

    - name: Save latest Develop
      if: github.ref == 'refs/heads/master'
      run: |
        mkdir public
        mkdir public/dev
        cp -R ${GITHUB_REPOSITORY#*/}-gh-pages/dev/. public/dev || true

    - name: Save latest Master
      if: github.ref == 'refs/heads/develop'
      run: |
        mkdir public
        cp -R ${GITHUB_REPOSITORY#*/}-gh-pages/. public || true
        rm -rf public/dev || true
        mkdir public/dev

    - name: Backup benchmark (master)
      if: github.ref == 'refs/heads/master'
      run: |
        cp -R ${GITHUB_REPOSITORY#*/}-gh-pages/bench/. tmp-bench || true

    - name: Backup benchmark (develop)
      if: github.ref == 'refs/heads/develop'
      run: |
        cp -R ${GITHUB_REPOSITORY#*/}-gh-pages/dev/bench/. tmp-bench || true

    # Заголовочные блоки страниц диагностик и список диагностик генерируются из
    # метаданных самих классов диагностик прямо в каталог docs.
    - name: Generate diagnostic docs
      run: |
        ./gradlew --no-daemon generateDiagnosticDocs --build
        ./gradlew --no-daemon generateDiagnosticsIndex --build

    # JSON-схемы конфигурационного файла публикуются по постоянным адресам
    # вида /configuration/schema.json — на них ссылается свойство $schema.
    - name: Copy configuration schemas
      run: |
        mkdir -p docs/public/configuration
        cp -R src/main/resources/com/github/_1c_syntax/bsl/languageserver/configuration/. docs/public/configuration

    - name: Build documentation site
      run: |
        npm ci
        npm run docs:build

    - name: Copy benchmark and javadoc
      run: |
        mkdir -p docs/.vitepress/dist/bench
        cp -R tmp-bench/. docs/.vitepress/dist/bench || true
        rm -rf tmp-bench
        cp -R build/docs/javadoc docs/.vitepress/dist/javadoc
        echo "" > docs/.vitepress/dist/.nojekyll

    - name: Publish Master
      if: github.ref == 'refs/heads/master'
      run: cp -R docs/.vitepress/dist/. public

    - name: Publish Develop
      if: github.ref == 'refs/heads/develop'
      run: cp -R docs/.vitepress/dist/. public/dev

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_branch: gh-pages
        publish_dir: ./public
