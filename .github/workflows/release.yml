name: Make image

# Release flow:
# 1. Push a tag and create a *draft* release for it (in any order):
#    `vX.Y.Z` must be a release, `vX.Y.Z-rc.N` (any suffix) must be marked as a pre-release.
# 2. This workflow builds all artifacts on the tag.
# 3. The `publish-release` job attaches them to the draft release and only then publishes it.
# 4. Maven Central and Docker Hub publications are started after the release is published.
#
# Draft releases do not trigger `release` events, and a release published with GITHUB_TOKEN
# does not trigger other workflows, so downstream publications are invoked explicitly.

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
               os: [windows-latest, ubuntu-latest, macOS-latest]
               include:
                    - os: windows-latest
                      displayName: Windows
                      prefix: win
                      app-image: bsl-language-server
                    - os: ubuntu-latest
                      displayName: Linux
                      prefix: nix
                      app-image: bsl-language-server
                    - os: macOS-latest
                      displayName: MacOS
                      prefix: mac
                      app-image: bsl-language-server.app
        runs-on: ${{ matrix.os }}
        name: (${{ matrix.displayName }}) create image app version

        steps:
            - name: Checkout source
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: Set up JDK
              uses: actions/setup-java@v6
              with:
                java-version: 25
                distribution: 'zulu'
                cache: gradle

            - name: Build bootJar with Gradle
              run: ./gradlew check bootJar

            - name: Build jpackage application image
              run: python .github/scripts/build-jpackage.py ${{ matrix.prefix }} ${{ matrix.app-image }}

            - name: Verify archive size
              run: python .github/scripts/verify-archive-size.py bsl-language-server_${{ matrix.prefix }}.zip

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                name: bsl-language-server_${{ matrix.prefix }}.zip
                path: ./${{ matrix.app-image }}
                overwrite: true

            - name: Upload release asset (image archive)
              uses: actions/upload-artifact@v7
              with:
                name: release-assets-${{ matrix.prefix }}
                path: ./bsl-language-server_${{ matrix.prefix }}.zip
                if-no-files-found: error
                overwrite: true

            - name: Build with Gradle
              if: matrix.prefix == 'nix'
              run: ./gradlew build -x test

            - name: Upload release assets (jars)
              if: matrix.prefix == 'nix'
              uses: actions/upload-artifact@v7
              with:
                name: release-assets-jars
                path: ./build/libs/*.jar
                if-no-files-found: error
                overwrite: true

    publish-release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        name: Attach assets and publish release
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ github.ref_name }}
        steps:
            - name: Download release assets
              uses: actions/download-artifact@v8
              with:
                pattern: release-assets-*
                merge-multiple: true
                path: dist

            - name: Attach assets and publish release
              run: |
                if ! RELEASE=$(gh release view "$TAG" --json isDraft,isPrerelease); then
                  echo "::error::Release for tag $TAG not found. Create a draft release for this tag and re-run failed jobs."
                  exit 1
                fi
                IS_DRAFT=$(jq -r '.isDraft' <<< "$RELEASE")
                IS_PRERELEASE=$(jq -r '.isPrerelease' <<< "$RELEASE")
                echo "Release for $TAG found: $RELEASE"

                # vX.Y.Z is a release, anything with a suffix (vX.Y.Z-rc.N) is a pre-release
                if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  EXPECTED_PRERELEASE=false
                else
                  EXPECTED_PRERELEASE=true
                fi
                if [[ "$IS_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
                  echo "::error::Release $TAG has prerelease=$IS_PRERELEASE, but its tag requires prerelease=$EXPECTED_PRERELEASE. Fix the 'Set as a pre-release' flag of the release and re-run failed jobs."
                  exit 1
                fi

                ls -l dist
                gh release upload "$TAG" dist/* --clobber

                if [[ "$IS_DRAFT" == "true" ]]; then
                  gh release edit "$TAG" --draft=false
                else
                  echo "::notice::Release $TAG is already published, assets were updated"
                fi

    publish-to-maven-central:
        needs: publish-release
        uses: ./.github/workflows/publish-to-maven-central.yml
        secrets: inherit

    publish-to-docker-hub:
        needs: publish-release
        uses: ./.github/workflows/publish-to-docker-hub.yml
        permissions:
            contents: read
        secrets: inherit
