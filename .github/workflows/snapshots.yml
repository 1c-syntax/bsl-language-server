name: Snapshots

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  semantic-tokens:
    name: Semantic tokens snapshots
    if: github.event_name == 'push' || startsWith(github.head_ref, 'translations_') == false
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sentry сопоставляет базовую сборку по SHA коммита, а не merge-коммита PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'corretto'
          cache: gradle
      - name: Render snapshots
        run: ./gradlew semanticTokensSnapshots --stacktrace
      - name: Archive snapshots
        uses: actions/upload-artifact@v7
        with:
          name: semantic-tokens-snapshots
          path: build/snapshots/semantic-tokens
      - name: Upload snapshots to Sentry
        # У PR из форков нет доступа к секретам.
        if: env.SENTRY_AUTH_TOKEN != ''
        # Закреплённый бинарник из релиза вместо npm-пакета: без install-скриптов и плавающей версии.
        env:
          SENTRY_CLI_VERSION: 3.8.2
          SENTRY_CLI_SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  $RUNNER_TEMP/sentry-cli" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/sentry-cli"
          "$RUNNER_TEMP/sentry-cli" snapshots upload build/snapshots/semantic-tokens \
            --app-id bsl-language-server-semantic-tokens
